<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Camila Method</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c9a96e;
      --accent2: #b8935a;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --dim: #555;
      --green: #4caf50;
      --red: #ef5350;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: Inter, sans-serif; min-height: 100vh; }

    /* LOGIN */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px 32px; width: 100%; max-width: 380px;
    }
    .login-card h1 { font-size: 22px; margin-bottom: 8px; }
    .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .login-card input {
      width: 100%; background: #242424; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 16px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .login-card input:focus { border-color: var(--accent); outline: none; }
    .btn {
      width: 100%; background: var(--accent); border: none; border-radius: 8px;
      color: #0d0d0d; cursor: pointer; font-size: 14px; font-weight: 800;
      letter-spacing: 0.04em; padding: 16px; text-transform: uppercase;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent2); }
    .error { color: var(--red); font-size: 13px; margin-top: 10px; text-align: center; }

    /* DASHBOARD */
    #dashboard { display: none; }
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 16px; font-weight: 700; color: var(--accent); }
    .topbar-logout { background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; font-size: 13px; padding: 6px 14px; }
    .topbar-logout:hover { border-color: var(--accent); color: var(--text); }

    .main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* DATE PICKER */
    .datepicker-bar {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 20px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .preset-btn {
      background: #242424; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; font-size: 13px; padding: 7px 14px;
      transition: all 0.2s;
    }
    .preset-btn:hover, .preset-btn.active {
      background: rgba(201,169,110,0.12); border-color: var(--accent); color: var(--accent);
    }
    .date-sep { color: var(--dim); font-size: 13px; }
    .date-input {
      background: #242424; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 13px; padding: 7px 12px;
    }
    .date-input:focus { border-color: var(--accent); outline: none; }
    .apply-btn {
      background: var(--accent); border: none; border-radius: 6px;
      color: #0d0d0d; cursor: pointer; font-size: 13px; font-weight: 700;
      padding: 8px 18px; margin-left: auto;
    }
    .apply-btn:hover { background: var(--accent2); }

    /* METRICS */
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .metric-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px;
    }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
    .metric-value { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
    .metric-conv { color: var(--muted); font-size: 13px; }
    .metric-card.payments .metric-value { color: var(--green); }

    /* CHART */
    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px; margin-bottom: 24px;
    }
    .chart-title { font-size: 14px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 20px; }
    .chart-wrap { position: relative; height: 280px; }

    /* FUNNEL TABLE */
    .table-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .table-title { font-size: 14px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 20px 24px;
      border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      padding: 12px 24px; text-align: left; text-transform: uppercase; }
    td { border-top: 1px solid var(--border); color: var(--text);
      font-size: 14px; padding: 14px 24px; }
    .funnel-bar-wrap { background: #242424; border-radius: 4px; height: 6px; width: 140px; }
    .funnel-bar { background: var(--accent); border-radius: 4px; height: 6px; }
    .conv-good { color: var(--green); font-weight: 700; }
    .conv-bad { color: var(--red); font-weight: 700; }

    .loading { text-align: center; padding: 60px; color: var(--muted); }

    @media (max-width: 600px) {
      .main { padding: 16px; }
      .datepicker-bar { gap: 8px; }
      td, th { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>Camila Method</h1>
    <p>Acesso restrito ao painel administrativo.</p>
    <input type="password" id="pwd-input" placeholder="Senha" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Entrar</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <span class="topbar-title">Camila Method - Dashboard</span>
    <button class="topbar-logout" onclick="logout()">Sair</button>
  </div>
  <div class="main">

    <!-- DATE PICKER -->
    <div class="datepicker-bar">
      <button class="preset-btn" onclick="setPreset('today')">Hoje</button>
      <button class="preset-btn" onclick="setPreset('yesterday')">Ontem</button>
      <button class="preset-btn active" onclick="setPreset('7d')">7 dias</button>
      <button class="preset-btn" onclick="setPreset('28d')">28 dias</button>
      <button class="preset-btn" onclick="setPreset('custom')">Personalizado</button>
      <span class="date-sep" id="custom-dates" style="display:none">
        <input type="date" class="date-input" id="date-from">
        ate
        <input type="date" class="date-input" id="date-to">
      </span>
      <button class="apply-btn" onclick="loadData()">Aplicar</button>
    </div>

    <!-- METRICS -->
    <div class="metrics" id="metrics">
      <div class="loading">Carregando...</div>
    </div>

    <!-- CHART -->
    <div class="chart-card">
      <div class="chart-title">Evolucao diaria</div>
      <div class="chart-wrap">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <!-- USERS TABLE -->
    <div class="table-card" style="margin-bottom:24px">
      <div class="table-title">Usuarios no funil</div>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Username</th>
            <th>Etapa</th>
            <th>Entrou em</th>
            <th>Contato</th>
          </tr>
        </thead>
        <tbody id="users-table"><tr><td colspan="5" style="color:var(--dim);text-align:center;padding:20px">Carregando...</td></tr></tbody>
      </table>
    </div>

    <!-- FUNNEL TABLE -->
    <div class="table-card">
      <div class="table-title">Funil de conversao</div>
      <table>
        <thead>
          <tr>
            <th>Etapa</th>
            <th>Total</th>
            <th>Conversao</th>
            <th>Barra</th>
          </tr>
        </thead>
        <tbody id="funnel-table"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
  let chartInstance = null;
  let currentRange = { from: null, to: null };
  let cachedData = null;

  function getPassword() { return localStorage.getItem('admin_pwd') || ''; }

  function doLogin() {
    const pwd = document.getElementById('pwd-input').value;
    localStorage.setItem('admin_pwd', pwd);
    loadData();
  }

  document.getElementById('pwd-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function logout() {
    localStorage.removeItem('admin_pwd');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-error').textContent = '';
    document.getElementById('pwd-input').value = '';
  }

  function setPreset(preset) {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    const custom = document.getElementById('custom-dates');
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    if (preset === 'today') {
      currentRange.from = today.getTime();
      currentRange.to = today.getTime() + 86399999;
      custom.style.display = 'none';
    } else if (preset === 'yesterday') {
      const y = new Date(today.getTime() - 86400000);
      currentRange.from = y.getTime();
      currentRange.to = y.getTime() + 86399999;
      custom.style.display = 'none';
    } else if (preset === '7d') {
      currentRange.from = today.getTime() - 6 * 86400000;
      currentRange.to = today.getTime() + 86399999;
      custom.style.display = 'none';
    } else if (preset === '28d') {
      currentRange.from = today.getTime() - 27 * 86400000;
      currentRange.to = today.getTime() + 86399999;
      custom.style.display = 'none';
    } else {
      custom.style.display = 'inline-flex';
      custom.style.alignItems = 'center';
      custom.style.gap = '8px';
      const f = document.getElementById('date-from');
      const t = document.getElementById('date-to');
      if (!f.value) f.value = today.toISOString().split('T')[0];
      if (!t.value) t.value = today.toISOString().split('T')[0];
      currentRange.from = new Date(f.value).getTime();
      currentRange.to = new Date(t.value).getTime() + 86399999;
    }
  }

  function initRange() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentRange.from = today.getTime() - 6 * 86400000;
    currentRange.to = today.getTime() + 86399999;
  }

  async function loadData() {
    const custom = document.getElementById('custom-dates');
    if (custom.style.display !== 'none') {
      const f = document.getElementById('date-from').value;
      const t = document.getElementById('date-to').value;
      if (f) currentRange.from = new Date(f).getTime();
      if (t) currentRange.to = new Date(t).getTime() + 86399999;
    }

    const pwd = getPassword();
    const url = `/api/admin-data?password=${encodeURIComponent(pwd)}&from=${currentRange.from}&to=${currentRange.to}`;

    try {
      const res = await fetch(url);
      if (res.status === 401) {
        document.getElementById('login-error').textContent = 'Senha incorreta.';
        return;
      }
      const data = await res.json();
      document.getElementById('login-error').textContent = '';
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      cachedData = data;
      renderMetrics(data.totals);
      renderChart(data.days);
      renderFunnel(data.totals);
      renderUsers(data.users || []);
    } catch (e) {
      document.getElementById('login-error').textContent = 'Erro ao carregar dados.';
    }
  }

  function pct(a, b) {
    if (!b) return '0%';
    return (a / b * 100).toFixed(1) + '%';
  }

  function renderMetrics(t) {
    const conv = t.step1 ? (t.payments / t.step1 * 100).toFixed(1) : 0;
    document.getElementById('metrics').innerHTML = `
      <div class="metric-card">
        <div class="metric-label">Bot iniciados</div>
        <div class="metric-value">${t.step1}</div>
        <div class="metric-conv">Entraram no funil</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Video 1 enviado</div>
        <div class="metric-value">${t.step1}</div>
        <div class="metric-conv">100% do total</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Step 2 (3 min)</div>
        <div class="metric-value">${t.step2}</div>
        <div class="metric-conv">${pct(t.step2, t.step1)} do step 1</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Oferta enviada</div>
        <div class="metric-value">${t.step3}</div>
        <div class="metric-conv">${pct(t.step3, t.step1)} do step 1</div>
      </div>
      <div class="metric-card payments">
        <div class="metric-label">Pagamentos</div>
        <div class="metric-value">${t.payments}</div>
        <div class="metric-conv">${conv}% de conversao</div>
      </div>
    `;
  }

  function renderChart(days) {
    const labels = Object.keys(days).map(d => {
      const [y, m, day] = d.split('-');
      return `${day}/${m}`;
    });
    const s1 = Object.values(days).map(d => d.step1);
    const s2 = Object.values(days).map(d => d.step2);
    const s3 = Object.values(days).map(d => d.step3);
    const pay = Object.values(days).map(d => d.payments);

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('myChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Bot iniciados', data: s1, borderColor: '#c9a96e', backgroundColor: 'rgba(201,169,110,0.08)', tension: 0.3, fill: true },
          { label: 'Step 2', data: s2, borderColor: '#64b5f6', backgroundColor: 'transparent', tension: 0.3 },
          { label: 'Oferta enviada', data: s3, borderColor: '#ce93d8', backgroundColor: 'transparent', tension: 0.3 },
          { label: 'Pagamentos', data: pay, borderColor: '#4caf50', backgroundColor: 'rgba(76,175,80,0.08)', tension: 0.3, fill: true }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#a0a0a0', font: { size: 12 } } } },
        scales: {
          x: { grid: { color: '#1e1e1e' }, ticks: { color: '#666' } },
          y: { grid: { color: '#1e1e1e' }, ticks: { color: '#666', stepSize: 1 }, beginAtZero: true }
        }
      }
    });
  }

  function renderFunnel(t) {
    const rows = [
      { label: 'Bot iniciado (video 1)', value: t.step1, prev: t.step1 },
      { label: 'Step 2 - lembrete (3 min)', value: t.step2, prev: t.step1 },
      { label: 'Oferta enviada (5 min)', value: t.step3, prev: t.step1 },
      { label: 'Pagamentos realizados', value: t.payments, prev: t.step1, highlight: true }
    ];
    const max = t.step1 || 1;
    document.getElementById('funnel-table').innerHTML = rows.map(r => {
      const c = r.prev ? (r.value / r.prev * 100).toFixed(1) : 0;
      const barW = Math.round(r.value / max * 100);
      const cls = r.highlight ? 'conv-good' : (c > 50 ? 'conv-good' : c > 20 ? '' : 'conv-bad');
      return `<tr>
        <td>${r.label}</td>
        <td><strong>${r.value}</strong></td>
        <td class="${cls}">${c}%</td>
        <td><div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${barW}%"></div></div></td>
      </tr>`;
    }).join('');
  }

  function renderUsers(users) {
    const stepLabels = { 1: 'Video 1', 2: 'Lembrete', 3: 'Oferta enviada' };
    const stepColors = { 1: '#c9a96e', 2: '#64b5f6', 3: '#ce93d8' };
    if (!users.length) {
      document.getElementById('users-table').innerHTML = '<tr><td colspan="5" style="color:var(--dim);text-align:center;padding:20px">Nenhum usuario neste periodo</td></tr>';
      return;
    }
    document.getElementById('users-table').innerHTML = users.map(u => {
      const date = new Date(u.joinedAt);
      const dateStr = `${date.getDate().toString().padStart(2,'0')}/${(date.getMonth()+1).toString().padStart(2,'0')} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
      const stepLabel = stepLabels[u.step] || 'Step ' + u.step;
      const stepColor = stepColors[u.step] || '#a0a0a0';
      const username = u.username ? `@${u.username}` : 'sem username';
      const tgLink = u.username ? `https://t.me/${u.username}` : `tg://user?id=${u.chatId}`;
      return `<tr>
        <td><strong>${u.firstName || 'sem nome'}</strong></td>
        <td style="color:var(--muted)">${username}</td>
        <td><span style="color:${stepColor};font-weight:700;font-size:12px">${stepLabel}</span></td>
        <td style="color:var(--muted);font-size:13px">${dateStr}</td>
        <td><a href="${tgLink}" target="_blank" style="color:var(--accent);font-size:13px;text-decoration:none">Abrir chat</a></td>
      </tr>`;
    }).join('');
  }

  // Init
  initRange();
  if (getPassword()) loadData();
</script>
</body>
</html>
