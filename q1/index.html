<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazilian Massage Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="quiz-container">
    <div class="progress-wrapper">
      <p class="progress-label">Step 1 of 5</p>
      <div class="progress-bar"><div class="progress-fill" style="width:20%"></div></div>
    </div>
    <section class="question-card" aria-labelledby="qt">
      <p class="question-tag">Quick Quiz</p>
      <h1 class="question-title" id="qt">How would you describe your current level of connection with your partner?</h1>
      <div class="options-list">
        <button class="option" onclick="go(1,'a','/q2')"><span class="option-letter">A</span>Very fulfilling, we feel deeply connected</button>
        <button class="option" onclick="go(1,'b','/q2')"><span class="option-letter">B</span>Decent, but something is missing</button>
        <button class="option" onclick="go(1,'c','/q2')"><span class="option-letter">C</span>Distant, we have lost that spark</button>
        <button class="option" onclick="go(1,'d','/q2')"><span class="option-letter">D</span>I am single and want to build more confidence</button>
      </div>
    </section>
    <p class="quiz-footer">Your answers are 100% private. <a href="/privacy">Privacy Policy</a></p>
  </main>
  <script>
  function go(step, val, next) {
    try { var a = JSON.parse(localStorage.getItem('bm_answers') || '{}'); a['q'+step] = val; localStorage.setItem('bm_answers', JSON.stringify(a)); } catch(e) {}
    window.location.href = next;
  }
  </script>
</body>
</html>
