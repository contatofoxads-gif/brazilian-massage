  <main class="quiz-container">

        <button class="option" onclick="go(this,2,'a','/q3')"><span class="option-letter">A</span>Almost every day, it is taking a toll</button>

  <script>
  function go(el, step, val, next) {
    document.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    try { (window.dataLayer = window.dataLayer || []).push({ event: 'quiz_option_selected', quiz_step: step, quiz_answer: val }); } catch(e) {}
