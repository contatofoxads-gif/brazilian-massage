<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | Brazilian Massage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="quiz-container">
    <div class="progress-wrapper">
      <p class="progress-label">Pergunta 3 de 5</p>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 60%"></div>
      </div>
    </div>

    <section class="question-card" aria-labelledby="question-title">
      <p class="question-tag">Quiz rapido</p>
      <h1 class="question-title" id="question-title">Mesmo homens experientes podem ignorar sinais sutis. Qual desses voce acha mais importante perceber?</h1>

      <div class="options-list">
        <button class="option" data-value="a" type="button">
          <span class="option-letter">A</span>
          A respiracao dela.
        </button>
        <button class="option" data-value="b" type="button">
          <span class="option-letter">B</span>
          O ritmo do corpo.
        </button>
        <button class="option" data-value="c" type="button">
          <span class="option-letter">C</span>
          Mudancas de tensao e relaxamento.
        </button>
        <button class="option" data-value="d" type="button">
          <span class="option-letter">D</span>
          Como ela responde ao toque.
        </button>
      </div>

      <button class="btn-continue" type="button" onclick="window.location.href='/q4'">Continuar</button>
    </section>

    <p class="quiz-footer">Suas respostas sao privadas. <a href="/privacy">Politica de Privacidade</a></p>
  </main>

  <script>const CURRENT_QUESTION = 3;</script>
  <script src="/js/quiz.js"></script>
</body>
</html>
