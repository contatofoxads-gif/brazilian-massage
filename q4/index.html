<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazilian Massage Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="quiz-container">
    <div class="progress-wrapper">
      <p class="progress-label">Step 4 of 5</p>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 80%"></div>
      </div>
    </div>

    <section class="question-card" aria-labelledby="question-title">
      <p class="question-tag">Quick Quiz</p>
      <h1 class="question-title" id="question-title">What would improve your quality of life the most right now?</h1>

      <div class="options-list">
        <button class="option" data-value="a" type="button">
          <span class="option-letter">A</span>
          Deeper emotional and physical connection.
        </button>
        <button class="option" data-value="b" type="button">
          <span class="option-letter">B</span>
          More confidence in private moments.
        </button>
        <button class="option" data-value="c" type="button">
          <span class="option-letter">C</span>
          Better stress relief and body awareness.
        </button>
        <button class="option" data-value="d" type="button">
          <span class="option-letter">D</span>
          A more fulfilling relationship.
        </button>
      </div>

      <button class="btn-continue" type="button" onclick="window.location.href='/q5'">Continue</button>
    </section>

    <p class="quiz-footer">Your answers are private. <a href="/privacy">Privacy Policy</a></p>
  </main>

  <script>const CURRENT_QUESTION = 4;</script>
  <script src="/js/quiz.js"></script>
</body>
</html>
