  <title>Quiz Dominancia Masculina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>.reaction-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.4s ease}.reaction-card{background:#1a1a1a;border:1px solid #c9a96e;border-radius:16px;padding:36px 28px;max-width:420px;width:100%;text-align:center}.reaction-eyebrow{color:#c9a96e;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:16px}.reaction-quote{color:#f5f5f5;font-family:'Playfair Display',serif;font-size:19px;font-style:italic;line-height:1.6}</style>
</head>
<body>
  <div class="reaction-overlay" id="ov"><div class="reaction-card"><p class="reaction-eyebrow">Ela pensa...</p><p class="reaction-quote" id="rq"></p></div></div>
  <main class="quiz-container">
    <div class="progress-wrapper">
      <p class="progress-label">Pergunta 8 de 10</p>
      <div class="progress-bar"><div class="progress-fill" style="width:80%"></div></div>
    </div>
    <section class="question-card" aria-labelledby="qt">
      <p class="question-tag">Dominancia Masculina</p>
      <h1 class="question-title" id="qt">Ela suspira fundo e diz baixinho: "nao para". Voce:</h1>
      <div class="options-list">
        <button class="option" onclick="go(8,'a','Ele diminuiu o ritmo quando eu pedi para nao parar. Quase enlouqueci.','/q9')"><span class="option-letter">A</span>Diminuo o ritmo de proposito ate ela pedir de novo</button>
        <button class="option" onclick="go(8,'b','Ele aumentou sem dizer nada. Eu perdi a nocao do tempo.','/q9')"><span class="option-letter">B</span>Aumento a intensidade sem dizer nada</button>
        <button class="option" onclick="go(8,'c','Ele olhou nos meus olhos e sorriu. Senti que estava em boas maos.','/q9')"><span class="option-letter">C</span>Olho nos olhos dela e sorrio antes de continuar</button>
        <button class="option" onclick="go(8,'d','Ele perguntou se eu estava bem. Gentil. Mas queria que ele simplesmente continuasse.','/q9')"><span class="option-letter">D</span>Pergunto se ela esta bem</button>
      </div>
    </section>
    <p class="quiz-footer">Suas respostas sao 100% privadas. <a href="/privacy">Politica de Privacidade</a></p>
  </main>
  <script>
  function go(step,val,reaction,next){try{var a=JSON.parse(localStorage.getItem('bm_answers')||'{}');a['q'+step]=val;localStorage.setItem('bm_answers',JSON.stringify(a));}catch(e){}var ov=document.getElementById('ov');document.getElementById('rq').textContent='"'+reaction+'"';ov.style.opacity='1';ov.style.pointerEvents='all';setTimeout(function(){window.location.href=next;},2500);}
  </script>
</body>
